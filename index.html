<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/style.css" />
    <title>AI Quotes</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Welcome to AI Quotes Generator</h1>
      </header>

      <main>
        <form id="quotes-generator-form">
          <input 
            type="text" 
            placeholder="Enter topic of quote"
            autofocus 
            required 
            autocomplete="off" 
            class="instructions"
          />
          <input type="submit" value="Generate" />
        </form>

        <div class="quotes" id="quotes">
    
         
        </div>
      </main>

      <footer>
        This AI Project was coded by Thamandree Govender (Ronel) and is
        <a href="https://github.com/Ronel518/quotes---generator" target="_blank">
          open-sourced on GitHub
        </a>
        and is 
        <a href="https://ai-quote-generatorp.netlify.app/" target="_blank">
          on Netlify
        </a>
      </footer>
    </div>
<script src="https://cdn.jsdelivr.net/npm/typewriter-effect@2.18.0/dist/core.js"></script>

    <script src="src/index.js"></script>
  </body>
</html>
